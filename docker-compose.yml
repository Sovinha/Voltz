version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: voltz_backend
    restart: always
    ports:
      - "5000:5000"
    environment:
      - FLASK_PORT=5000
      - FLASK_DEBUG=False
    volumes:
      - backend_data:/app/database

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_BACKEND_URL: http://143.95.215.217:5000
    container_name: voltz_frontend
    restart: always
    ports:
      - "3002:3000"
    depends_on:
      - backend



volumes:
  backend_data:
