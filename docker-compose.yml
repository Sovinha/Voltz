version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: voltz_backend
    restart: always
    ports:
      - "5000:5000"
    environment:
      - FLASK_PORT=5000
      - FLASK_DEBUG=False
      - DEEPSEEK_API_KEY=${DEEPSEEK_API_KEY}
      - OSRM_BASE_URL=${OSRM_BASE_URL:-http://voltz_osrm:5000}

    volumes:
      - backend_data:/app/database

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_BACKEND_URL: http://143.95.215.217:5000
    container_name: voltz_frontend
    restart: always
    ports:
      - "3002:3000"
    depends_on:
      - backend

  # Servidor OSRM Self-Hosted (Roteamento Offline de Alta Performance)
  osrm:
    image: osrm/osrm-backend:latest
    container_name: voltz_osrm
    restart: always
    ports:
      - "5001:5000"
    command: osrm-routed --algorithm mld /data/paraiba-latest.osrm
    volumes:
      - ./osrm_data:/data

volumes:
  backend_data:


